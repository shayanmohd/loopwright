<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 108" width="108" height="108">
  <defs>
    <radialGradient id="stage" cx="0.5" cy="0.38" r="0.84">
      <stop offset="0" stop-color="#22261A"/>
      <stop offset="0.55" stop-color="#13150E"/>
      <stop offset="1" stop-color="#080905"/>
    </radialGradient>
    <radialGradient id="bloom" cx="0.5" cy="0.5" r="0.45">
      <stop offset="0" stop-color="#C3E640" stop-opacity="0.15"/>
      <stop offset="0.58" stop-color="#7EA019" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#7EA019" stop-opacity="0"/>
    </radialGradient>
    <!-- the loop is the deeper olive; the wave riding it is the lit chartreuse -->
    <linearGradient id="ringg" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#C9EC46"/>
      <stop offset="0.48" stop-color="#94BF1D"/>
      <stop offset="1" stop-color="#5B7A0F"/>
    </linearGradient>
    <linearGradient id="waveg" x1="0" y1="0.1" x2="0.92" y2="0.95">
      <stop offset="0" stop-color="#F4FCC8"/>
      <stop offset="0.42" stop-color="#DDF36E"/>
      <stop offset="1" stop-color="#B4DC2E"/>
    </linearGradient>
    <filter id="drop" filterUnits="userSpaceOnUse" x="0" y="0" width="108" height="108">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2.3"/>
      <feOffset dy="2.6" result="o"/>
      <feFlood flood-color="#050703" flood-opacity="0.66"/>
      <feComposite in2="o" operator="in"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="halo" filterUnits="userSpaceOnUse" x="0" y="0" width="108" height="108">
      <feGaussianBlur stdDeviation="3.4"/>
    </filter>
  </defs>

  <g id="bg">
    <rect width="108" height="108" fill="url(#stage)"/>
    <rect width="108" height="108" fill="url(#bloom)"/>
    <!-- faint tape lines, so the charcoal is a surface and not a void -->
    <g stroke="#C3E640" stroke-opacity="0.05" stroke-width="0.7">
      <path d="M0 19 H108"/><path d="M0 33 H108"/><path d="M0 75 H108"/><path d="M0 89 H108"/>
    </g>
    <circle cx="19" cy="16" r="0.9" fill="#DDF36E" opacity="0.4"/>
    <circle cx="91" cy="23" r="0.7" fill="#DDF36E" opacity="0.32"/>
    <circle cx="87" cy="93" r="0.8" fill="#DDF36E" opacity="0.26"/>
  </g>

  <!-- One waveform, bent until its ends meet the loop it is riding on.
       Everything sits inside r=33 of 54,54, so no launcher mask can clip it. -->
  <g id="fg">
    <circle cx="54" cy="54" r="26.5" fill="none" stroke="#7EA019" stroke-width="9" opacity="0.26" filter="url(#halo)"/>
    <circle cx="54" cy="54" r="26.5" fill="none" stroke="url(#ringg)" stroke-width="7.6" filter="url(#drop)"/>
    <!-- light along the top of the loop, the way a torus catches a lamp -->
    <path d="M33.6 35.2 A26.5 26.5 0 0 1 72.6 32.1" fill="none" stroke="#E6F79A" stroke-width="1.7"
          stroke-linecap="round" opacity="0.45"/>
    <path d="M27.5 54 C34.4 54 33.1 41 40 41 C47.7 41 46.3 67 54 67 C61.2 67 59.8 41 67 41 C74.4 41 73.1 54 80.5 54"
          fill="none" stroke="#C3E640" stroke-width="9.6" stroke-linecap="round" opacity="0.34" filter="url(#halo)"/>
    <path d="M27.5 54 C34.4 54 33.1 41 40 41 C47.7 41 46.3 67 54 67 C61.2 67 59.8 41 67 41 C74.4 41 73.1 54 80.5 54"
          fill="none" stroke="url(#waveg)" stroke-width="7.4" stroke-linecap="round" stroke-linejoin="round"
          filter="url(#drop)"/>
    <path d="M35.4 44.9 C36.9 42.5 38.3 41.7 40 41.7 C43.7 41.7 44.7 48.2 46.5 55.6"
          fill="none" stroke="#FBFFE6" stroke-width="1.5" stroke-linecap="round" opacity="0.55"/>
  </g>

  <g id="mono">
    <circle cx="54" cy="54" r="26.5" fill="none" stroke="#000" stroke-width="7.6"/>
    <path d="M27.5 54 C34.4 54 33.1 41 40 41 C47.7 41 46.3 67 54 67 C61.2 67 59.8 41 67 41 C74.4 41 73.1 54 80.5 54"
          fill="none" stroke="#000" stroke-width="7.4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
